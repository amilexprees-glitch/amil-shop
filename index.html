<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أميل | Amil Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 notranslate">

    <!-- الهيدر -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center gap-4">
            <div class="flex items-center gap-2.5">
                <div class="bg-blue-600 p-2 rounded-xl"><i class="fa-solid fa-bag-shopping text-xl"></i></div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black tracking-wide">متجر أميل</h1>
                    <p class="text-[11px] text-slate-400">تسوق بثقة وتوصيل سريع</p>
                </div>
            </div>

            <div class="flex-grow max-w-md hidden sm:block">
                <input type="text" id="searchInput" oninput="renderProducts()" placeholder="ابحث عن منتج..." class="w-full bg-slate-800 text-white text-sm rounded-xl px-4 py-2 border border-slate-700 focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="toggleCart()" class="relative bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition shadow">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hidden sm:inline">السلة</span>
                <span id="cartCount" class="bg-amber-400 text-slate-900 text-xs font-black px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- شريط التصنيفات -->
    <div class="bg-white border-b sticky top-[64px] z-30 shadow-sm">
        <div id="categoriesBar" class="max-w-7xl mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto text-xs sm:text-sm font-bold">
            <button onclick="selectCategory('الكل')" class="cat-btn bg-blue-600 text-white px-4 py-1.5 rounded-full whitespace-nowrap">الكل</button>
            <button onclick="selectCategory('الساعات')" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap">الساعات</button>
            <button onclick="selectCategory('إلكترونيات')" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap">إلكترونيات</button>
            <button onclick="selectCategory('أزياء وملابس')" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap">أزياء وملابس</button>
            <button onclick="selectCategory('العناية بالبشرة')" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap">العناية بالبشرة</button>
            <button onclick="selectCategory('الأحذية')" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap">الأحذية</button>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="max-w-7xl mx-auto px-4 py-6 pb-24">
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <div class="col-span-full text-center py-16 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-600"></i>
                <p>جاري تحميل أحدث العروض والمنتجات من قاعدة البيانات...</p>
            </div>
        </div>
    </main>

    <!-- أزرار الدعم السريع (خدمة العملاء والـ AI) -->
    <div class="fixed bottom-6 left-6 z-40 flex flex-col gap-3">
        <a href="https://wa.me/201000000000?text=مرحباً، أريد الاستفسار عن المنتجات والطلبات" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl transition transform hover:scale-105" title="خدمة العملاء واتساب">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <button onclick="toggleAiChat()" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full flex items-center justify-center text-xl shadow-xl transition transform hover:scale-105" title="المساعد الذكي">
            <i class="fa-solid fa-robot"></i>
        </button>
    </div>

    <!-- نافذة المساعد الذكي -->
    <div id="aiModal" class="fixed bottom-24 left-6 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 z-50 hidden flex flex-col h-[400px] overflow-hidden">
        <div class="bg-slate-900 text-white p-3.5 flex justify-between items-center">
            <span class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-robot text-blue-400"></i> مساعد أميل الذكي</span>
            <button onclick="toggleAiChat()" class="text-slate-400 hover:text-white font-bold text-lg">×</button>
        </div>
        <div id="aiChatBody" class="flex-grow p-3 overflow-y-auto space-y-3 text-xs sm:text-sm bg-slate-50">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 max-w-[85%]">
                مرحباً بك! أنا مساعدك الذكي في متجر أميل. كيف يمكنني مساعدتك في اختيار المنتجات اليوم؟
            </div>
        </div>
        <div class="p-3 bg-white border-t flex gap-2">
            <input type="text" id="aiInput" placeholder="اكتب سؤالك هنا..." class="flex-grow border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-600" onkeypress="if(event.key==='Enter') sendAiMessage()">
            <button onclick="sendAiMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- سلة المشتريات الجانبية -->
    <div id="cartDrawer" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-5 shadow-2xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-lg font-black flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-blue-600"></i> سلة مشترياتك</h2>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">×</button>
                </div>
                <div id="cartItems" class="space-y-3 mb-6"></div>
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between font-black text-base mb-4">
                    <span>الإجمالي الكلي:</span>
                    <span id="cartTotal" class="text-blue-600">0 ج.م</span>
                </div>

                <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3 text-xs sm:text-sm bg-slate-50 p-4 rounded-2xl border">
                    <h3 class="font-bold text-slate-800 mb-1">بيانات التوصيل (الدفع عند الاستلام)</h3>
                    <input type="tel" id="custPhone" onblur="lookupCustomer()" placeholder="رقم الهاتف (01xxxxxxxxx)" required class="w-full border rounded-xl p-2.5 bg-white">
                    <input type="text" id="custName" placeholder="الاسم بالكامل" required class="w-full border rounded-xl p-2.5 bg-white">
                    <input type="text" id="custAddress" placeholder="المحافظة / المدينة / العنوان بالتفصيل" required class="w-full border rounded-xl p-2.5 bg-white">
                    <button type="submit" id="submitOrderBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                        تأكيد الطلب الآن ✅
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyUAgFDO07FaQ1Ilc9-7focFP1R9oRdcgHIcdhdk0MlJtXmmdwTx5nU7_WBXuAxSBunHA/exec";
        let allProducts = [];
        let cart = [];
        let activeCategory = "الكل";

        window.addEventListener('DOMContentLoaded', () => {
            fetch(API_URL + "?action=getProducts")
                .then(res => res.json())
                .then(data => {
                    allProducts = data.products || [];
                    renderProducts();
                })
                .catch(() => {
                    document.getElementById('productsGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">تعذر تحميل المنتجات من الشيت. تأكد من إضافة منتجات في ورقة Products.</div>`;
                });
        });

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = btn.innerText === cat 
                    ? "cat-btn bg-blue-600 text-white px-4 py-1.5 rounded-full whitespace-nowrap"
                    : "cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-full whitespace-nowrap";
            });
            renderProducts();
        }

        function renderProducts() {
            const query = (document.getElementById('searchInput')?.value || "").toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchCat = activeCategory === "الكل" || p.category === activeCategory;
                const matchText = String(p.name).toLowerCase().includes(query);
                return matchCat && matchText;
            });

            if (filtered.length === 0) {
                document.getElementById('productsGrid').innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد منتجات مسجلة في شيت جوجل حالياً. أضف منتجات لتظهر هنا.</div>`;
                return;
            }

            document.getElementById('productsGrid').innerHTML = filtered.map(p => {
                const isJumia = p.affiliateUrl && p.affiliateUrl.trim() !== "";
                const actionButton = isJumia
                    ? `<a href="${p.affiliateUrl}" target="_blank" rel="noopener noreferrer" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1.5 transition shadow-sm">
                         <span>اطلب من جوميا</span> <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                       </a>`
                    : `<button onclick="addToCart('${p.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1.5 transition shadow-sm">
                         <i class="fa-solid fa-cart-plus"></i> <span>أضف للسلة</span>
                       </button>`;

                const sourceBadge = isJumia
                    ? `<span class="absolute top-2.5 right-2.5 bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">عرض جوميا</span>`
                    : `<span class="absolute top-2.5 right-2.5 bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">شحن سريع</span>`;

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        ${sourceBadge}
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3.5 flex-grow flex flex-col justify-between">
                        <div>
                            <span class="text-[11px] text-slate-400 font-semibold">${p.category}</span>
                            <h3 class="font-bold text-slate-800 text-xs sm:text-sm line-clamp-2 mt-0.5 mb-2">${p.name}</h3>
                        </div>
                        <div>
                            <div class="text-base sm:text-lg font-black text-emerald-600 mb-3">${Number(p.price).toLocaleString()} ج.م</div>
                            ${actionButton}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function addToCart(prodId) {
            const prod = allProducts.find(p => p.id === prodId);
            if (!prod) return;
            cart.push(prod);
            updateCartUI();
            toggleCart(true);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            let total = 0;
            if (cart.length === 0) {
                document.getElementById('cartItems').innerHTML = `<p class="text-center text-slate-400 text-sm py-8">السلة فارغة حالياً</p>`;
            } else {
                document.getElementById('cartItems').innerHTML = cart.map((item, idx) => {
                    total += Number(item.price) || 0;
                    return `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border">
                        <div class="flex items-center gap-2.5">
                            <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <h4 class="font-bold text-xs">${item.name}</h4>
                                <span class="text-xs font-extrabold text-emerald-600">${item.price} ج.م</span>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                }).join('');
            }
            document.getElementById('cartTotal').innerText = total.toLocaleString() + " ج.م";
        }

        function toggleCart(forceOpen = null) {
            const drawer = document.getElementById('cartDrawer');
            if (forceOpen === true) drawer.classList.remove('hidden');
            else drawer.classList.toggle('hidden');
        }

        function toggleAiChat() {
            const modal = document.getElementById('aiModal');
            modal.classList.toggle('hidden');
        }

        function sendAiMessage() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBody = document.getElementById('aiChatBody');
            chatBody.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-2xl shadow-sm max-w-[85%] mr-auto">${text}</div>`;
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            setTimeout(() => {
                let reply = "أهلاً بك! يمكنك اختيار أي منتج وإضافته للسلة، أو التواصل معنا عبر زر واتساب الأخضر لأي استفسار عاجل.";
                if (text.includes("سعر") || text.includes("كام")) reply = "أسعارنا تنافسية وتظهر أسفل كل منتج، وتستطيع الطلب والدفع عند الاستلام.";
                else if (text.includes("شحن") || text.includes("توصيل")) reply = "نحن نغطي جميع محافظات وجه بحري بتوصيل سريع وآمن حتى باب المنزل.";
                
                chatBody.innerHTML += `<div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 max-w-[85%]">${reply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 600);
        }

        function lookupCustomer() {
            const phone = document.getElementById('custPhone').value.trim();
            if (phone.length < 10) return;
            fetch(`${API_URL}?action=checkCustomer&phone=${encodeURIComponent(phone)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "found") {
                        if (!document.getElementById('custName').value) document.getElementById('custName').value = data.name;
                        if (!document.getElementById('custAddress').value) document.getElementById('custAddress').value = data.address;
                    }
                }).catch(() => {});
        }

        function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) { alert("يرجى إضافة منتج واحد على الأقل للسلة."); return; }
            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerText = "جاري تسجيل الطلب...";

            const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            const itemsSummary = cart.map(i => i.name).join(" + ");

            const payload = {
                action: "newOrder",
                customerName: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddress').value,
                items: itemsSummary,
                total: total,
                seller: "أميل إكسبريس"
            };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => {
                    alert(`تم تأكيد طلبك بنجاح! رقم الطلب: ${data.orderId || ''}`);
                    cart = [];
                    updateCartUI();
                    document.getElementById('checkoutForm').reset();
                    toggleCart();
                })
                .catch(() => {
                    alert("تم استلام طلبك بنجاح! سنتواصل معك قريباً.");
                    cart = [];
                    updateCartUI();
                    toggleCart();
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = "تأكيد الطلب الآن ✅";
                });
        }
    </script>
</body>
</html>
