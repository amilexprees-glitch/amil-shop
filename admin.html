<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | منصة النخبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-body: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: #0f172a; color: white; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-logo { font-size: 20px; font-weight: 900; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; color: #818cf8; }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu li a { color: #94a3b8; text-decoration: none; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .sidebar-menu li.active a, .sidebar-menu li a:hover { background: var(--primary); color: white; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .header-admin h1 { font-size: 22px; font-weight: 850; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 55px; height: 55px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 22px; background: #e0e7ff; color: var(--primary); }
        .stat-info span { font-size: 13px; color: var(--text-muted); display: block; }
        .stat-info h3 { font-size: 22px; font-weight: 900; margin-top: 4px; }

        .admin-section { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 30px; display: none; }
        .admin-section.active-tab { display: block; }

        .section-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .section-title-row h3 { font-size: 18px; font-weight: 800; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; align-items: center; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 14px; background: #fff; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); }

        .btn-action { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; margin-top: 10px; }
        .btn-action:hover { background: #3730a3; }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 15px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; font-weight: 700; color: var(--text-muted); }
        .btn-delete { background: #fee2e2; color: var(--danger); border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .btn-delete:hover { background: #fecaca; }

        .select-rep { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; font-weight: bold; background: #f8fafc; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="sidebar-logo"><i class="fa-solid fa-gauge-high"></i> لوحة الإدارة</div>
            <ul class="sidebar-menu">
                <li id="menuOrders" class="active"><a onclick="switchTab('orders')"><i class="fa-solid fa-house"></i> الرئيسية (الطلبات)</a></li>
                <li id="menuProducts"><a onclick="switchTab('products')"><i class="fa-solid fa-boxes-stacked"></i> المنتجات</a></li>
            </ul>
        </div>
        <div style="font-size: 12px; color: #64748b; text-align: center;">منصة النخبة © 2026</div>
    </div>

    <div class="main-content">
        <div class="header-admin">
            <h1 id="headerTitle">إدارة الطلبات والمناديب اللوجستية 👋</h1>
            <span style="font-weight: 700; color: var(--success);"><i class="fa-solid fa-circle" style="font-size: 10px;"></i> النظام متصل ويعمل بكفاءة</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="stat-info">
                    <span>إجمالي المنتجات</span>
                    <h3 id="totalProductsCount">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #d1fae5; color: #065f46;"><i class="fa-solid fa-bag-shopping"></i></div>
                <div class="stat-info">
                    <span>الطلبات الواردة</span>
                    <h3 id="totalOrdersCount">0</h3>
                </div>
            </div>
        </div>

        <!-- قسم الطلبات الواردة وإسناد المناديب وتصدير التقارير -->
        <div class="admin-section active-tab" id="sectionOrders">
            <div class="section-title-row">
                <h3>🛒 الطلبات الواردة وإسناد المناديب وحالات التوصيل</h3>
                <div>
                    <button onclick="exportOrdersToCSV()" style="background:#10b981; color:white; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:12px; margin-left:8px;"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                    <button onclick="clearAllOrders()" style="background:#fee2e2; color:var(--danger); border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:12px;"><i class="fa-solid fa-trash"></i> مسح السجل</button>
                </div>
            </div>
            <div id="adminOrdersList"></div>
        </div>

        <!-- قسم إدارة المنتجات -->
        <div class="admin-section" id="sectionProducts">
            <div class="section-title-row">
                <h3>📦 إضافة منتج جديد ورفع صورته وتحديد قسمه</h3>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="pName" placeholder="مثلاً: ساعة ذكية">
                </div>
                <div class="form-group">
                    <label>السعر بالجنيه</label>
                    <input type="text" id="pPrice" placeholder="مثلاً: 499 ج.م">
                </div>
                <div class="form-group">
                    <label>اختر صورة المنتج من جهازك</label>
                    <input type="file" id="pImageFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>القسم</label>
                    <select id="pCategory">
                        <option value="electronics">⚡ إلكترونيات</option>
                        <option value="skincare">🌿 العناية بالبشرة</option>
                        <option value="shoes">👟 الأحذية</option>
                        <option value="clothes">👕 الملابس</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" onclick="addNewProduct()"><i class="fa-solid fa-plus"></i> إضافة المنتج للمتجر</button>

            <div style="margin-top: 30px;">
                <h4 style="margin-bottom: 15px; font-size: 16px;">المنتجات الحالية في النظام:</h4>
                <div id="adminProductsList"></div>
            </div>
        </div>
    </div>

<script>
    let adminProducts = JSON.parse(localStorage.getItem('amil_store_products')) || [];

    function switchTab(tab) {
        document.getElementById('menuOrders').classList.remove('active');
        document.getElementById('menuProducts').classList.remove('active');
        document.getElementById('sectionOrders').classList.remove('active-tab');
        document.getElementById('sectionProducts').classList.remove('active-tab');

        if(tab === 'orders') {
            document.getElementById('menuOrders').classList.add('active');
            document.getElementById('sectionOrders').classList.add('active-tab');
            document.getElementById('headerTitle').innerText = "إدارة الطلبات والمناديب اللوجستية 👋";
            loadAdminOrders();
        } else if(tab === 'products') {
            document.getElementById('menuProducts').classList.add('active');
            document.getElementById('sectionProducts').classList.add('active-tab');
            document.getElementById('headerTitle').innerText = "إدارة وتصنيف المنتجات المعروضة 📦";
            renderAdminProducts();
        }
    }

    function saveAndRender() {
        localStorage.setItem('amil_store_products', JSON.stringify(adminProducts));
        renderAdminProducts();
    }

    function renderAdminProducts() {
        const container = document.getElementById('adminProductsList');
        document.getElementById('totalProductsCount').innerText = adminProducts.length;
        
        if(adminProducts.length === 0) {
            container.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>لا توجد منتجات حالياً.</p>";
            return;
        }

        const catNames = {
            "electronics": "إلكترونيات",
            "skincare": "العناية بالبشرة",
            "shoes": "الأحذية",
            "clothes": "الملابس"
        };

        let html = `<table><thead><tr><th>صورة</th><th>اسم المنتج</th><th>القسم</th><th>السعر</th><th>إجراء</th></tr></thead><tbody>`;
        adminProducts.forEach(p => {
            html += `<tr>
                <td><img src="${p.img}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;"></td>
                <td><b>${p.name}</b></td>
                <td><span style="background:#e0e7ff; color:#4f46e5; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;">${catNames[p.category] || 'عام'}</span></td>
                <td><span style="color:var(--danger); font-weight:bold;">${p.price}</span></td>
                <td><button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function addNewProduct() {
        const name = document.getElementById('pName').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategory').value;
        const fileInput = document.getElementById('pImageFile');

        if(!name || !price) {
            alert("يرجى كتابة اسم المنتج والسعر على الأقل!");
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                saveProductToStore(name, price, category, imgData);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveProductToStore(name, price, category, "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500");
        }
    }

    function saveProductToStore(name, price, category, img) {
        const newP = { id: Date.now(), name, price, category, img };
        adminProducts.push(newP);
        
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImageFile').value = '';

        saveAndRender();
        alert("✅ تمت إضافة المنتج بنجاح!");
    }

    function deleteProduct(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            adminProducts = adminProducts.filter(p => p.id !== id);
            saveAndRender();
        }
    }

    function loadAdminOrders() {
        const ordersContainer = document.getElementById('adminOrdersList');
        if (!ordersContainer) return;

        let orders = JSON.parse(localStorage.getItem('amil_store_orders')) || [];
        document.getElementById('totalOrdersCount').innerText = orders.length;

        if (orders.length === 0) {
            ordersContainer.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>لا توجد طلبات جديدة حتى الآن.</p>";
            return;
        }

        const repsList = ["اختر المندوب...", "ماهر", "خليل", "سليم", "مجدى", "جبر", "رأفت", "تتح"];

        let html = `<table><thead><tr><th>العميل ورقم الهاتف</th><th>العنوان</th><th>المنتج</th><th>المندوب المسؤول</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
        
        orders.forEach((o, index) => {
            let statusBadge = '';
            if(o.status === 'قيد الانتظار' || !o.status) {
                statusBadge = `<span style='background:#fef3c7; color:#d97706; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px;'>⏳ قيد الانتظار</span>`;
            } else if(o.status === 'تم الشحن للمندوب') {
                statusBadge = `<span style='background:#e0e7ff; color:#4f46e5; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px;'>🚚 تم الشحن</span>`;
            } else if(o.status === 'تم التوصيل بنجاح') {
                statusBadge = `<span style='background:#d1fae5; color:#065f46; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px;'>✅ تم التسليم</span>`;
            }

            let repSelectOptions = '';
            repsList.forEach(rep => {
                let selected = (o.assignedRep === rep) ? 'selected' : '';
                repSelectOptions += `<option value="${rep}" ${selected}>${rep}</option>`;
            });

            html += `<tr>
                <td><b>${o.clientName}</b><br><span style="font-size:12px; color:var(--text-muted);">${o.clientPhone}</span></td>
                <td>${o.clientAddress}</td>
                <td style="color:var(--primary); font-weight:bold;">${o.productName}</td>
                <td>
                    <select class="select-rep" onchange="assignRep(${index}, this.value)">
                        ${repSelectOptions}
                    </select>
                </td>
                <td>${statusBadge}</td>
                <td>
                    <button style="background:#10b981; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px;" onclick="updateOrderStatus(${index}, 'تم التوصيل بنجاح')">توصيل</button>
                    <button style="background:#4f46e5; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:11px;" onclick="updateOrderStatus(${index}, 'تم الشحن للمندوب')">شحن</button>
                    <button class="btn-delete" onclick="deleteOrder(${index})">حذف</button>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        ordersContainer.innerHTML = html;
    }

    function assignRep(index, repName) {
        let orders = JSON.parse(localStorage.getItem('amil_store_orders')) || [];
        orders[index].assignedRep = repName;
        localStorage.setItem('amil_store_orders', JSON.stringify(orders));
    }

    function updateOrderStatus(index, newStatus) {
        let orders = JSON.parse(localStorage.getItem('amil_store_orders')) || [];
        orders[index].status = newStatus;
        localStorage.setItem('amil_store_orders', JSON.stringify(orders));
        loadAdminOrders();
    }

    function deleteOrder(index) {
        if(confirm("هل تريد حذف هذا الطلب؟")) {
            let orders = JSON.parse(localStorage.getItem('amil_store_orders')) || [];
            orders.splice(index, 1);
            localStorage.setItem('amil_store_orders', JSON.stringify(orders));
            loadAdminOrders();
        }
    }

    function clearAllOrders() {
        if(confirm("هل أنت متأكد من مسح جميع سجلات الطلبات؟")) {
            localStorage.removeItem('amil_store_orders');
            loadAdminOrders();
        }
    }

    // تصدير الطلبات إلى ملف Excel / CSV
    function exportOrdersToCSV() {
        let orders = JSON.parse(localStorage.getItem('amil_store_orders')) || [];
        if(orders.length === 0) {
            alert("لا توجد طلبات للتصدير!");
            return;
        }

        let csvContent = "\uFEFFاسم العميل,رقم الهاتف,العنوان,المنتج والمبلغ,المندوب,الحالة,التاريخ\n";
        orders.forEach(o => {
            let row = `"${o.clientName}","${o.clientPhone}","${o.clientAddress}","${o.productName}","${o.assignedRep || 'غير مسند'}","${o.status || 'قيد الانتظار'}","${o.date}"\n`;
            csvContent += row;
        });

        let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `orders_report_${Date.now()}.csv`;
        a.click();
    }

    window.addEventListener('storage', function(e) {
        if (e.key === 'amil_store_orders' || e.key === 'amil_store_products') {
            loadAdminOrders();
            renderAdminProducts();
        }
    });

    window.onload = function() {
        renderAdminProducts();
        loadAdminOrders();
    }
</script>

</body>
</html>
